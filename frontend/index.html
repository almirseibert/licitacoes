<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel de Licitações — Studio Mythos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Fraunces:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Seção 2: aplica o tema antes de pintar (mesma regra de servicos/tema.js). -->
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('licitacoes.tema'); } catch (e) {}
        if (t !== 'claro' && t !== 'escuro') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'escuro';
        }
        document.documentElement.dataset.tema = t;
      })();
    </script>
  </head>
  <body class="bg-obsidiana">
    <div id="raiz"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
